name: Deploy Gyroscope to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gyroscope-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # Each compatibility line (0.x) gets its own folder, so installs of an older line keep loading their own build.
      - id: line
        run: echo "dir=v$(node -p "require('./package.json').version.split('.')[1]")" >> "$GITHUB_OUTPUT"
      # The Pages site is the gh-pages branch. `keep_files` leaves the root (0.2), /odm-plugin/ and older lines in place;
      # plugin.json names the same folder as its delivery URL.
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          destination_dir: ${{ steps.line.outputs.dir }}
          keep_files: true
