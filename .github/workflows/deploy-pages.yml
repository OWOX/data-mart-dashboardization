name: Deploy Gyroscope to GitHub Pages

on:
  push:
    branches: [feat/data-mart-dashboards]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gyroscope-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # The Pages site is the gh-pages branch. `keep_files` leaves /odm-plugin/ (Data Mart Dashboards) in place;
      # Gyroscope owns the root, which plugin.json names as its delivery URL.
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          keep_files: true
